name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (from ASMR-Mixer source)
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noctune-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release AAB
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE not set — skipping release AAB"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > android/keystore.jks
          cd android && ./gradlew bundleRelease -DkeystoreFile=keystore.jks \
            -DkeystorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -DkeyAlias="$ANDROID_KEY_ALIAS" \
            -DkeyPassword="$ANDROID_KEY_PASSWORD"

      - name: Upload release AAB
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: noctune-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
